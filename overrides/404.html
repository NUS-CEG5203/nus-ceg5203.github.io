<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting...</title>
    <script>
        var currentPath = window.location.pathname;

        // If the user types exactly "/assignments", treat it as "/assignments/"
        if (currentPath === '/assignments') {
            currentPath = '/assignments/';
        }

        // Now this correctly catches both "/assignments/" and "/assignments/somepage"
        if (currentPath.startsWith('/assignments/')) {
            // Strip "/assignments/" and replace it with "/"
            var newPath = currentPath.replace('/assignments/', '/');
            
            // Build the destination URL matching domain, query params, and page hashes
            var newURL = window.location.origin + newPath + window.location.search + window.location.hash;
            
            // Execute redirect
            window.location.replace(newURL);
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 2rem;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 5rem auto;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Page Not Found</h1>
        <p>The page you are looking for does not exist or has been moved.</p>
    </div>
</body>
</html>
